name: Read-only main v0.90 public byte audit
on:
  workflow_dispatch:
    inputs:
      reviewed_request_sha256:
        description: Exact independently approved execution request SHA256
        required: true
        type: string
      expected_audit_head:
        description: Exact independently approved audit-only commit SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: main-v0900-public-byte-audit
  cancel-in-progress: false
jobs:
  audit-main-public-bytes:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/audit-main-v0900'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out exact dispatched audit-only head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: audit-runner
          persist-credentials: false
      - name: Require exact approved audit head and request hash before public execution
        env:
          EXPECTED_AUDIT_HEAD: ${{ inputs.expected_audit_head }}
          DISPATCHED_AUDIT_HEAD: ${{ github.sha }}
          INPUT_REQUEST_SHA256: ${{ inputs.reviewed_request_sha256 }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, subprocess
          root = pathlib.Path('audit-runner')
          head = os.environ['EXPECTED_AUDIT_HEAD']
          assert re.fullmatch('[a-f0-9]{40}', head)
          assert head == os.environ['DISPATCHED_AUDIT_HEAD']
          assert subprocess.check_output(['git','-C',str(root),'rev-parse','HEAD'],text=True).strip() == head
          raw = (root/'audit-main/execution-request.reviewed.json').read_bytes()
          assert len(raw) <= 32768
          assert hashlib.sha256(raw).hexdigest() == 'd9f6ce88daee8faceaa79bebb652cad98a7eb23659cce4e6e8339d0968aff4c5' == os.environ['INPUT_REQUEST_SHA256']
          request = json.loads(raw)
          assert request['reviewed'] is True
          assert request['controllerCommit'] == 'c2d4789f08fde3a50a7218bbc5c0d6a3b8997a4f'
          assert request['controllerTree'] == '241e7666fa231c8bed926a929a9839a210dfa2b8'
          PY
      - name: Hold exact deployed main controller and catalog
        uses: actions/checkout@v4
        with:
          repository: mekhovov/revealline
          ref: c2d4789f08fde3a50a7218bbc5c0d6a3b8997a4f
          path: audit-runner/audit-main/repository
          persist-credentials: false
          sparse-checkout: |
            publishing/pages-controller/publication.json
            publishing/pages-controller/catalog.json
          sparse-checkout-cone-mode: false
      - name: Read complete actual production HTTP inventory with hashes and MIME
        run: python3 audit-runner/audit-main/http-tools/http_audit.py --run
      - name: Retain bounded audit evidence and every attempt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: main-v0900-public-http-evidence
          if-no-files-found: error
          path: audit-runner/audit-main/http/
