name: Read-only RevealLine Archive58 public byte audit
on:
  workflow_dispatch:
    inputs:
      expected_audit_head:
        description: Independently reviewed exact audit-only commit
        required: true
        type: string
      execution_request_sha256:
        description: Independently reviewed SHA-256 of the committed actual production request
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: archive58-read-only-public-audit
  cancel-in-progress: false
jobs:
  audit-public-bytes:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/audit-archive58-http'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out the exact audit workflow commit without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: audit-runner
          persist-credentials: false
      - name: Require the independently reviewed actual production request
        id: binding
        env:
          EXPECTED_REQUEST_SHA256: ${{ inputs.execution_request_sha256 }}
          EXPECTED_AUDIT_HEAD: ${{ inputs.expected_audit_head }}
        run: |
          python3 -B - <<'PY'
          import hashlib, json, os, re, subprocess
          from pathlib import Path
          head = os.environ['EXPECTED_AUDIT_HEAD']
          assert re.fullmatch('[a-f0-9]{40}', head)
          assert os.environ['GITHUB_SHA'] == head
          assert subprocess.check_output(['git', '-C', 'audit-runner', 'rev-parse', 'HEAD'], text=True).strip() == head
          target = Path('audit-runner/audit/execution-request.reviewed.json')
          assert target.is_file() and not target.is_symlink()
          assert target.stat().st_size <= 32768
          raw = target.read_bytes()
          expected = os.environ['EXPECTED_REQUEST_SHA256']
          assert re.fullmatch('[a-f0-9]{64}', expected)
          assert hashlib.sha256(raw).hexdigest() == expected
          value = json.loads(raw)
          assert value['format'] == 'revealline-archive58-http-request.v1'
          assert value['reviewed'] is True
          assert value['archiveTree'] == 'be7851a079bf66b1014731973c7a566113570776'
          commit = value['archiveCommit']
          assert re.fullmatch('[a-f0-9]{40}', commit)
          assert value['sourceCheckoutCommit'] == commit
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('archive_commit=' + commit + '\n')
          PY
      - name: Check out only the exact actual deployed archive commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.binding.outputs.archive_commit }}
          path: audit-runner/audit/repository
          persist-credentials: false
      - name: Validate original production evidence and audit every expected HTTP body
        run: python3 -B audit-runner/audit/http-tools/http_audit.py --run
      - name: Retain every attempt, including failures, without public payload files
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: archive58-public-http-evidence
          if-no-files-found: error
          path: audit-runner/audit/http/

